<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Calculator - Sleek & Fast Single Calculator</title>
  <meta name="description" content="A sleek, modern, single calculator featuring standard & scientific functions, memory, history, and beautiful custom themes.">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="app-container">
    <!-- Header Bar -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">∑</div>
        <div class="brand-text">Smart Calc</div>
      </div>

      <div class="header-controls">
        <button class="mode-toggle-btn" id="sciToggleBtn" title="Toggle Scientific Keypad">🧪 Scientific</button>
        <button class="icon-btn" id="themeBtn" title="Change Theme" aria-label="Toggle Theme">🌙</button>
        <button class="icon-btn" id="historyBtn" title="Calculation History" aria-label="View History">📜</button>
        <button class="icon-btn" id="settingsBtn" title="App Settings" aria-label="Open Settings">⚙️</button>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="app-content">
      <!-- Calculator Display -->
      <div class="calc-display">
        <div class="display-indicators">
          <span class="indicator hidden" id="degRadIndicator">DEG</span>
          <span class="indicator hidden" id="memIndicator">M</span>
        </div>
        <div class="display-expression" id="mainExpression"></div>
        <div class="display-result" id="mainResult">0</div>
      </div>

      <!-- Toolbar: Memory & Utility Buttons -->
      <div class="quick-toolbar">
        <div class="mem-btns">
          <button class="mem-btn" data-mem="MC">MC</button>
          <button class="mem-btn" data-mem="MR">MR</button>
          <button class="mem-btn" data-mem="M+">M+</button>
          <button class="mem-btn" data-mem="M-">M-</button>
          <button class="mem-btn" data-mem="MS">MS</button>
        </div>
        <button class="mem-btn" id="copyResultBtn" title="Copy Result">📋 Copy</button>
      </div>

      <!-- Scientific Keypad Drawer (Collapsible) -->
      <div class="scientific-panel hidden" id="sciPanel">
        <button class="btn btn-scientific" id="degRadToggle">DEG</button>
        <button class="btn btn-scientific" data-fn="sin">sin</button>
        <button class="btn btn-scientific" data-fn="cos">cos</button>
        <button class="btn btn-scientific" data-fn="tan">tan</button>
        <button class="btn btn-scientific" data-key="(">(</button>
        <button class="btn btn-scientific" data-key=")">)</button>

        <button class="btn btn-scientific" data-fn="log">log</button>
        <button class="btn btn-scientific" data-fn="ln">ln</button>
        <button class="btn btn-scientific" data-fn="sqrt">√</button>
        <button class="btn btn-scientific" data-fn="pow2">x²</button>
        <button class="btn btn-scientific" data-fn="powY">xʸ</button>
        <button class="btn btn-scientific" data-fn="fact">x!</button>

        <button class="btn btn-scientific" data-fn="pi">π</button>
        <button class="btn btn-scientific" data-fn="e">e</button>
        <button class="btn btn-scientific" data-fn="abs">|x|</button>
        <button class="btn btn-scientific" data-fn="mod">Mod</button>
        <button class="btn btn-scientific" data-fn="asin">asin</button>
        <button class="btn btn-scientific" data-fn="acos">acos</button>
      </div>

      <!-- Main Standard Keypad Grid -->
      <div class="keypad">
        <button class="btn btn-action" data-key="AC">AC</button>
        <button class="btn btn-action" data-key="C">C</button>
        <button class="btn btn-scientific" data-key="±">±</button>
        <button class="btn btn-operator" data-key="÷">÷</button>

        <button class="btn" data-key="7">7</button>
        <button class="btn" data-key="8">8</button>
        <button class="btn" data-key="9">9</button>
        <button class="btn btn-operator" data-key="×">×</button>

        <button class="btn" data-key="4">4</button>
        <button class="btn" data-key="5">5</button>
        <button class="btn" data-key="6">6</button>
        <button class="btn btn-operator" data-key="-">-</button>

        <button class="btn" data-key="1">1</button>
        <button class="btn" data-key="2">2</button>
        <button class="btn" data-key="3">3</button>
        <button class="btn btn-operator" data-key="+">+</button>

        <button class="btn" data-key="%">%</button>
        <button class="btn" data-key="0">0</button>
        <button class="btn" data-key=".">.</button>
        <button class="btn btn-equals" data-key="=">=</button>
      </div>
    </main>

    <!-- History Bottom Drawer -->
    <div class="drawer" id="historyDrawer">
      <div class="drawer-header">
        <div style="font-weight:700; font-size:1.1rem;">📜 History</div>
        <div style="display:flex; gap:8px;">
          <button class="mem-btn" id="exportHistoryBtn">📥 Export CSV</button>
          <button class="mem-btn" id="clearHistoryBtn" style="color:var(--action-color);">🗑️ Clear</button>
          <button class="icon-btn" id="closeHistoryBtn" style="width:30px; height:30px;">✕</button>
        </div>
      </div>
      <div class="history-list" id="historyList">
        <div class="text-center" style="color:var(--text-muted); padding:30px;">No calculations saved yet</div>
      </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
      <div class="modal-content">
        <div style="display:flex; justify-style:space-between; align-items:center; border-bottom:1px solid var(--bg-input); padding-bottom:10px;">
          <h3 style="font-weight:700;">⚙️ Calculator Settings</h3>
          <button class="icon-btn" id="closeSettingsBtn">✕</button>
        </div>

        <div class="form-group">
          <label class="form-label" for="themeSelect">Theme Preset</label>
          <select class="form-control" id="themeSelect">
            <option value="dark">Dark Glass (Default)</option>
            <option value="light">Light Mode</option>
            <option value="cyberpunk">Cyberpunk Neon</option>
            <option value="sunset">Sunset Gold</option>
            <option value="emerald">Emerald Slate</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="precisionSelect">Decimal Precision</label>
          <select class="form-control" id="precisionSelect">
            <option value="2">2 Decimals (0.00)</option>
            <option value="4" selected>4 Decimals (0.0000)</option>
            <option value="6">6 Decimals (0.000000)</option>
            <option value="8">8 Decimals (0.00000000)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="soundToggle">Sound Feedback</label>
          <select class="form-control" id="soundToggle">
            <option value="on">Sound Enabled 🔊</option>
            <option value="off">Mute Sound 🔇</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="vibrationToggle">Vibration Haptics</label>
          <select class="form-control" id="vibrationToggle">
            <option value="on">Vibration Enabled 📳</option>
            <option value="off">Vibration Disabled 📴</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Toast Notifications Container -->
    <div class="toast-container" id="toastContainer"></div>

  </div>

  <!-- JavaScript Modules -->
  <script src="js/history.js"></script>
  <script src="js/calculators/basic.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
